# Spatial detector: EfficientNet-B0 on face crops (CPU-tuned)
model:
  backbone: efficientnet_b0
  pretrained: true
  num_classes: 1            # single logit, BCE
  drop_rate: 0.3

data:
  processed_root: data/processed
  img_size: 160             # 160px ~2x faster than 224 on CPU, minor AUC cost
  frames_per_video: 16
  batch_size: 32
  workers: 2

train:
  epochs_head: 1
  epochs_finetune: 2        # head epoch + 2 full fine-tune epochs
  lr_head: 1.0e-3
  lr_finetune: 3.0e-5
  weight_decay: 1.0e-4
  num_threads: 16
  seed: 42
  ckpt: checkpoints/spatial_effb0.pt

eval:
  batch_size: 64
