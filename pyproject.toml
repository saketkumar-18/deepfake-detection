[project]
name = "deepfake-detection"
version = "1.0.0"
description = "Spatial-temporal deepfake video detection: EfficientNet spatial detector + temporal transformer, with cross-generator generalization analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saket Kumar" }]
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=0.9",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "rich>=13.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
app = ["gradio>=4.0", "fastapi>=0.104", "uvicorn>=0.24"]
dev = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
